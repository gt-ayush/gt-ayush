<svg xmlns="http://www.w3.org/2000/svg" width="600" height="200" style="background:black">
  <style>
    text {
      fill: #0F0;
      font-family: monospace;
      font-size: 20px;
    }
  </style>

  <!-- Column 1 -->
  <text x="50" y="0">01</text>
  <animateTransform attributeName="transform" type="translate" from="0 0" to="0 220" dur="4s" repeatCount="indefinite" />

  <!-- Column 2 -->
  <text x="120" y="0">AYUSH</text>
  <animateTransform attributeName="transform" type="translate" from="0 0" to="0 220" dur="5s" repeatCount="indefinite" />

  <!-- Column 3 -->
  <text x="200" y="0">CONNECT</text>
  <animateTransform attributeName="transform" type="translate" from="0 0" to="0 220" dur="3s" repeatCount="indefinite" />

  <!-- Column 4 -->
  <text x="300" y="0">SECURITY</text>
  <animateTransform attributeName="transform" type="translate" from="0 0" to="0 220" dur="6s" repeatCount="indefinite" />

  <!-- Column 5 -->
  <text x="400" y="0">LINUX</text>
  <animateTransform attributeName="transform" type="translate" from="0 0" to="0 220" dur="4.5s" repeatCount="indefinite" />
</svg>
